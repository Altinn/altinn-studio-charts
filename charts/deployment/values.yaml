replicaCount: 2

autoscaling:
  enabled: true
  replicas:
    min: 2
    max: 6
  avgCpuUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

resources:
  requests:
    cpu: 50m
    memory: 256Mi

podAnnotations:
  {}
  # Additional pod annotations (e.g. for mesh injection)
  # Enabling of linkerd in seperate value under
  # config.linkerd.io/proxy-cpu-request: 10m
  # config.linkerd.io/proxy-memory-limit: 250Mi
  # config.linkerd.io/proxy-memory-request: 20Mi
podLabels:
  {}
podAntiAffinity:
  enabled: true

# Limits voluntary disruptions, such as node drains, to one pod at a time.
# Rendered only when the app can run more than one replica.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

terminationGracePeriodSeconds: 30

image:
  # Set "repository" name of your image for manual Helm install and upgrade.
  repository:
  tag: latest
  pullPolicy: Always
  pullSecrets: []
  envFrom: []
  # Additional environment variable sources.
  # Example:
  # envFrom:
  #   - configMapRef:
  #       name: apps-runtime-common-config-env
  #   - secretRef:
  #       name: apps-runtime-common-secrets-env
  # - name: myRegistryKeySecretName

service:
  type: ClusterIP
  externalPort: 80
  # If your application is running on another port, change only the internal port.
  internalPort: 5005
# Enable dual stack for service
ipv6:
  enabled: true

linkerd:
  enabled: true

ingressRoute:
  name: Will be inserted during deploy
  entryPoints:
    - http
    - https
  routes:
    - match: Will be inserted during deploy
      kind: Rule
      services:
        - name: Will be inserted during deploy
          port: 80
      middlewares:
        - name: hsts-header
  # # Specify ssl-cert secret if not using default
  # tls:
  #   secretName: ssl-cert

volumeMounts:
  - name: datakeys
    mountPath: /mnt/keys
  - name: accesstoken
    mountPath: "/accesstoken"

volumes:
  - name: datakeys
    persistentVolumeClaim:
      claimName: keys
  - name: accesstoken
    secret:
      secretName: accesstoken

appSecrets:
  mountPath: /mnt/app-secrets
  additionalSources: []
  # Additional projected volume sources merged into appSecrets.mountPath.
  # Example:
  # additionalSources:
  #   - configMap:
  #       name: apps-runtime-common-config
  #       items:
  #         - key: runtime-common.json
  #           path: runtime-common.json
  #   - secret:
  #       name: apps-runtime-common-secrets
  #       optional: true
  #       items:
  #         - key: runtime-common-secrets.json
  #           path: runtime-common-secrets.json

# The startup probe holds off readiness and liveness until the app answers, so neither needs an
# initial delay. It allows up to failureThreshold * periodSeconds (2 minutes) for the app to start.
# Unless startup.enabled is set, it is enabled with liveness, which would otherwise restart an app
# that starts slowly. Unless startup.path is set, it probes liveness.path.
# Readiness takes an unresponsive pod out of the Service after about 10 seconds, and liveness
# restarts it after 30-40. Timeouts do not exceed the period, so a hanging /health does not
# stretch either.
startup:
  failureThreshold: 120
  periodSeconds: 1
  timeoutSeconds: 1
readiness:
  enabled: false
  path: /health
  initialDelaySeconds: 0
  failureThreshold: 3
  periodSeconds: 3
  timeoutSeconds: 3
liveness:
  enabled: false
  path: /health
  initialDelaySeconds: 0
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 10

# Custom ingress routes (additional IngressRoutes beyond the main one)
# Example:
# customIngressRoutes:
#   - name: my-custom-ingress-route
#     entryPoints:
#       - http
#       - https
#     routes:
#       - kind: Rule
#         match: Host(`example.com`)&&PathPrefix(`/custom/`)
#         middlewares:
#           - name: hsts-header
#         services:
#           - name: my-service
#             port: 80
customIngressRoutes: []
